[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-manager"
version = "3.0.0"
description = "A command-line personal income and expense manager with an Albanian interface"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["finance", "budget", "cli", "expenses", "albanian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Albanian",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# No runtime dependencies: standard library only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
financat = "personal_finance.cli:main"

[tool.setuptools.packages.find]
include = ["personal_finance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["personal_finance"]
omit = ["personal_finance/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow names and use assert freely.
"tests/*" = ["B011"]
